[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sapphire"
version = "0.1"
dependencies = [
    "numpy",
    "pandas",
    "torch",
    "pika",
    "cryptography",
    "scikit-learn",
    "python-dotenv",
    "msgpack"
]
[project.scripts]
sapphire-server = "sapphire.server:main"
sapphire-client = "sapphire.client:main"

# where the code is
[tool.setuptools.packages.find]
include = ["sapphire"]